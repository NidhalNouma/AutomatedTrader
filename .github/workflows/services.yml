name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker
        uses: docker/setup-buildx-action@v1

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          project_id: ${{ secrets.GCP_ID }}
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_TELEGRAM_API_TOKEN=${{ secrets.NEXT_PUBLIC_TELEGRAM_API_TOKEN }}" >> .env
          echo "NEXT_PUBLIC_LANDING_URL=${{ secrets.NEXT_PUBLIC_LANDING_URL }}" >> .env
          echo "NEXT_PUBLIC_META_API_TOKEN=${{ secrets.NEXT_PUBLIC_META_API_TOKEN }}" >> .env
          echo "NEXT_PUBLIC_CHARGEBEE_SITE=${{ secrets.NEXT_PUBLIC_CHARGEBEE_SITE }}" >> .env
          echo "NEXT_PUBLIC_CHARGEBEE_API_KEY=${{ secrets.NEXT_PUBLIC_CHARGEBEE_API_KEY }}" >> .env
          echo "NEXT_PUBLIC_CHARGEBEE_API_KEY_B=${{ secrets.NEXT_PUBLIC_CHARGEBEE_API_KEY_B }}" >> .env
          echo "NEXT_PUBLIC_TEST_PROFILE_ID=${{ secrets.NEXT_PUBLIC_TEST_PROFILE_ID }}" >> .env
          echo "NEXT_PUBLIC_TEST_WEBHOOKS_LIST_IDS=${{ secrets.NEXT_PUBLIC_TEST_WEBHOOKS_LIST_IDS }}" >> .env
          echo "NEXT_PUBLIC_ALLOWED_EMAILS=${{ secrets.NEXT_PUBLIC_ALLOWED_EMAILS }}" >> .env
          echo "NEXT_PUBLIC_KLAVIO_PRIVATE_KEY=${{ secrets.NEXT_PUBLIC_KLAVIO_PRIVATE_KEY }}" >> .env
          echo "NEXT_PUBLIC_WEBHOOK_RECEIVER_URL=${{ secrets.NEXT_PUBLIC_WEBHOOK_RECEIVER_URL }}" >> .env
          echo "NEXT_PUBLIC_TRADE_MANAGEMENT_URL=${{ secrets.NEXT_PUBLIC_TRADE_MANAGEMENT_URL }}" >> .env

      - name: Prepare webhook-receiver build context
        run: |
          cp .env ./services/webhook-receiver/
          cp -r lib ./services/webhook-receiver/
          cp -r utils ./services/webhook-receiver/

      - name: Build and push webhook-receiver
        run: |
          docker build -t gcr.io/${{ secrets.GCP_ID }}/webhook-receiver ./services/webhook-receiver
          docker push gcr.io/${{ secrets.GCP_ID }}/webhook-receiver

      - name: Deploy webhook-receiver to Cloud Run
        run: |
          gcloud run deploy webhook-receiver \
            --image gcr.io/${{ secrets.GCP_ID }}/webhook-receiver \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_ID }}

      - name: Prepare trade-management build context
        run: |
          cp .env ./services/trade-management/
          cp -r lib ./services/trade-management/
          cp -r utils ./services/trade-management/

      - name: Build and push trade-management
        run: |
          docker build -t gcr.io/${{ secrets.GCP_ID }}/trade-management ./services/trade-management
          docker push gcr.io/${{ secrets.GCP_ID }}/trade-management

      - name: Deploy trade-management to Cloud Run
        run: |
          gcloud run deploy trade-management \
            --image gcr.io/${{ secrets.GCP_ID }}/trade-management \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_ID }}

      - name: Prepare frontend build context
        run: |
          cp .env ./frontend/
          cp -r lib ./frontend/
          cp -r utils ./frontend/

      - name: Build and push frontend
        run: |
          docker build -t gcr.io/${{ secrets.GCP_ID }}/frontend ./frontend
          docker push gcr.io/${{ secrets.GCP_ID }}/frontend

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy frontend \
            --image gcr.io/${{ secrets.GCP_ID }}/frontend \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --project ${{ secrets.GCP_ID }}
